[project]
name = "usearchwiki"
version = "0.0.0"
description = "Multi-model embedding dataset over FineWiki for ANN-search benchmarking"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=16",
]

[project.optional-dependencies]
dense    = ["httpx>=0.27"]
ground   = ["cupy-cuda12x>=14", "torch>=2.5"]
colbert  = ["pylate>=1.0"]
index    = ["usearch>=2.25"]
dev      = ["ruff>=0.15", "pytest>=8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # imports after sys.path manipulation

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
